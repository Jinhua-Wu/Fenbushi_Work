<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>网络疫情实验室</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0c1424;color:#e5edf8;font:15px 'Microsoft YaHei',sans-serif}header{padding:26px 4%;border-bottom:1px solid #30405a}h1{font-size:27px;margin:0 0 8px}p{color:#aebed5;margin:6px 0}main{padding:22px 4%;display:grid;grid-template-columns:280px 1fr;gap:22px}aside,.panel{background:#162238;border:1px solid #30405a;border-radius:12px;padding:18px}label{display:block;margin:14px 0 5px}select,input,button{font:inherit;width:100%;padding:9px;border:1px solid #465779;border-radius:6px;background:#0c1424;color:#e5edf8}button{background:#2378ae;cursor:pointer;margin-top:12px}button:hover{background:#2998cf}.cards{display:flex;gap:12px;margin-bottom:18px}.card{flex:1;padding:14px;background:#20334f;border-radius:8px}.card strong{display:block;font-size:23px;margin-top:8px}canvas{width:100%;display:block}#network{height:330px}#curve{height:230px}.legend{margin:10px 0;color:#b8c9df}.row{display:flex;gap:10px}.row>*{flex:1}small{line-height:1.7;color:#aebed5}#status{min-height:40px;margin-top:12px;color:#9bd8f6}@media(max-width:850px){main{grid-template-columns:1fr}.cards{flex-wrap:wrap}}</style>
<header><h1>网络疫情试验展示-2026305305-姜川-265班</h1><p>家庭&工作&社区&医院 | 四层接触网络与行为博弈</p></header>
<main><aside><label>对比场景</label><select id="scenario"></select><label>口罩覆盖率 <span id="maskValue">80%</span></label><input id="mask" type="range" min="0" max="1" step=".1" value=".8"><label>症状隔离比例 <span id="isoValue">80%</span></label><input id="isolation" type="range" min="0" max="1" step=".1" value=".8"><label>措施开始日</label><input id="policy" type="number" min="0" max="99" value="10"><label>随机种子</label><input id="seed" type="number" min="0" value="100"><button id="run">运行自定义仿真</button><small></small><div id="status" role="status"></div><hr><label>回放进度 第 <span id="dayValue">0</span> 天</label><input id="day" type="range" min="0" max="99" value="0"><div class="row"><button id="play">播放</button><button id="export">导出结果</button></div><p><small></small></p></aside>
<section><div class="cards"><div class="card">累计感染<strong id="cases"></strong></div><div class="card">感染峰值<strong id="peak"></strong></div><div class="card">院内传播<strong id="hospital"></strong></div><div class="card">床位超载人天<strong id="overflow"></strong></div></div><div class="panel"><canvas id="network"></canvas><div class="legend">● <span style="color:#7299bf">易感 S</span>　● <span style="color:#edc55f">潜伏 E</span>　● <span style="color:#f27878">传染 I</span>　● <span style="color:#6ed0ae">康复 R</span></div><canvas id="curve"></canvas><p id="caption"></p></div><p></p></section></main>
<script src="demo_data.js"></script><script>
const names={baseline:'无干预基线',mask:'仅戴口罩',isolation:'仅症状居家隔离',combined:'口罩 隔离 分诊综合',triage:'仅医院分诊',no_hospital:'移除医院接触层',random10:'随机保护10%节点',degree10:'按度保护10%节点',homogeneous:'同质传染性',late_combined:'第25天综合干预',game_high_cost:'行为博弈 高收入损失',game_subsidy:'行为博弈 隔离补贴',game_low_copay:'行为博弈 低医疗自付'};
const el=id=>document.getElementById(id);let current,day=0,timer;
for(const [v,n] of Object.entries(names)){let o=document.createElement('option');o.value=v;o.textContent=n;el('scenario').append(o)}
function load(r){current=r;day=0;el('day').max=r.history.length-1;el('day').value=0;for(let k of ['cases','peak','hospital','overflow'])el(k).textContent=r.metrics[k];draw()}
function ctx(id){let c=el(id),d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*d;c.height=h*d;let x=c.getContext('2d');x.scale(d,d);return [x,w,h]}
function draw(){if(!current)return;el('dayValue').textContent=day;let [g,w,h]=ctx('network'),n=current.config.n,colors=['#7299bf','#edc55f','#f27878','#6ed0ae'];let pos=Array.from({length:n},(_,i)=>{let group=Math.floor(i/4),angle=group*2.399963;let radius=Math.sqrt(group/(n/4))*.44;return [w/2+Math.cos(angle)*radius*w+Math.cos(i*Math.PI/2)*5,h/2+Math.sin(angle)*radius*h+Math.sin(i*Math.PI/2)*5]});g.strokeStyle='#31405a';g.lineWidth=.4;current.edges.filter((e,i)=>e[2]===0||i%9===0).forEach(e=>{g.beginPath();g.moveTo(...pos[e[0]]);g.lineTo(...pos[e[1]]);g.stroke()});pos.forEach((p,i)=>{g.fillStyle=colors[current.frames[day][i]];g.beginPath();g.arc(...p,Math.min(6,2+current.degree[i]/25),0,7);g.fill()});
let [q,cw,ch]=ctx('curve'),hs=current.history,max=Math.max(...hs.map(z=>Math.max(z.I,z.E,z.demand))),left=40,bottom=ch-30,plotH=ch-55;q.strokeStyle='#44536c';q.beginPath();q.moveTo(left,15);q.lineTo(left,bottom);q.lineTo(cw-15,bottom);q.stroke();q.font='12px sans-serif';q.fillStyle='#bacbe0';for(let a=0;a<=4;a++){let v=max*a/4;q.fillText(v.toFixed(0),3,bottom-plotH*a/4)}for(let a=0;a<=4;a++)q.fillText(Math.round((hs.length-1)*a/4),left+(cw-left-20)*a/4,bottom+20);for(let [key,col] of [['I','#f27878'],['E','#edc55f'],['demand','#6ed0ae']]){q.strokeStyle=col;q.lineWidth=2;q.beginPath();hs.forEach((r,i)=>{let x=left+i/(hs.length-1)*(cw-left-20),y=bottom-r[key]/Math.max(1,max)*plotH;i?q.lineTo(x,y):q.moveTo(x,y)});q.stroke()}q.strokeStyle='#ffffff';let x=left+day/(hs.length-1)*(cw-left-20);q.beginPath();q.moveTo(x,15);q.lineTo(x,bottom);q.stroke();let z=hs[day];el('caption').textContent=`第${day}天 S=${z.S} E=${z.E} I=${z.I} R=${z.R}；新增${z.new}；床位需求${z.demand}/${z.capacity}；执行系数${z.compliance.toFixed(2)}。曲线：红色 I、黄色 E、绿色需求。`}
el('scenario').onchange=()=>{load(DEMOS[el('scenario').value]);el('status').textContent='已载入预计算场景。'};
el('day').oninput=()=>{day=+el('day').value;draw()};el('mask').oninput=()=>el('maskValue').textContent=Math.round(el('mask').value*100)+'%';el('isolation').oninput=()=>el('isoValue').textContent=Math.round(el('isolation').value*100)+'%';
el('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;el('play').textContent='播放'}else{el('play').textContent='暂停';timer=setInterval(()=>{day=(day+1)%current.history.length;el('day').value=day;draw()},180)}};
el('run').onclick=async()=>{el('run').disabled=true;el('status').textContent='正在仿真…';try{let res=await fetch('/simulate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mask:+el('mask').value,isolation:+el('isolation').value,policy_day:+el('policy').value,seed:+el('seed').value,triage:1})});if(!res.ok)throw Error(await res.text());load(await res.json());el('status').textContent='自定义仿真完成，当前结果已更新。'}catch(e){el('status').textContent='请先运行 server.py 并通过本地地址打开页面。'+e.message}finally{el('run').disabled=false}};
el('export').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(current,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='simulation.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};window.onresize=draw;load(DEMOS.baseline);
</script></html>
